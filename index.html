<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salim Chart | تحليل الأسواق المالية</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body { background:#0b0f17; color:#e6edf3; min-height:100vh; }
  header { padding:14px 16px; background:#111827; border-bottom:1px solid #1f2937; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .brand { font-weight:800; font-size:20px; color:#22d3ee; }
  .brand span { color:#e6edf3; }
  .tag { font-size:12px; color:#94a3b8; }
  main { padding:14px; max-width:1200px; margin:auto; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  select, input, button { background:#111827; color:#e6edf3; border:1px solid #1f2937; border-radius:10px; padding:10px 12px; font-size:14px; }
  button { cursor:pointer; }
  button.active { background:#22d3ee; color:#04202a; border-color:#22d3ee; font-weight:700; }
  .grid { display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:900px){ .grid { grid-template-columns:2fr 1fr; } }
  .card { background:#111827; border:1px solid #1f2937; border-radius:14px; padding:14px; }
  .card h2 { font-size:16px; margin-bottom:10px; color:#22d3ee; }
  #chart { width:100%; height:420px; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
  .stat { background:#0b0f17; border:1px solid #1f2937; border-radius:10px; padding:10px; }
  .stat b { display:block; font-size:18px; }
  .up { color:#22c55e; } .down { color:#ef4444; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid #1f2937; }
  .row:last-child { border-bottom:0; }
  .small { font-size:12px; color:#94a3b8; }
  .danger { color:#ef4444; }
  .muted { color:#94a3b8; font-size:12px; margin-top:8px; }
  footer { padding:18px; text-align:center; color:#64748b; font-size:12px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Salim <span>Chart</span></div>
    <div class="tag">منصة تحليل الأسواق المالية</div>
  </div>
  <div class="tag">نسخة تجريبية • بيانات محاكاة</div>
</header>

<main>
  <div class="toolbar">
    <select id="symbolSelect"></select>
    <button data-ind="sma" class="active">SMA</button>
    <button data-ind="ema">EMA</button>
    <button data-ind="rsi">RSI</button>
    <button id="refreshBtn">تحديث</button>
  </div>

  <div class="grid">
    <section class="card">
      <h2 id="chartTitle">الرسم البياني</h2>
      <div id="chart"></div>
      <div class="stats">
        <div class="stat"><span class="small">السعر الحالي</span><b id="price">--</b></div>
        <div class="stat"><span class="small">التغير</span><b id="change">--</b></div>
        <div class="stat"><span class="small">أعلى سعر</span><b id="high">--</b></div>
        <div class="stat"><span class="small">أدنى سعر</span><b id="low">--</b></div>
      </div>
      <p class="muted">هذه نسخة تجريبية وتستخدم بيانات محاكاة لأغراض العرض فقط، وليست توصية استثمارية.</p>
    </section>

    <aside>
      <section class="card">
        <h2>قائمة المراقبة</h2>
        <div id="watchlist"></div>
      </section>

      <section class="card" style="margin-top:14px">
        <h2>تنبيه سعري</h2>
        <input id="alertPrice" type="number" placeholder="أدخل السعر المستهدف" />
        <button id="addAlert" style="width:100%;margin-top:10px">إضافة تنبيه</button>
        <div id="alerts" style="margin-top:12px"></div>
      </section>
    </aside>
  </div>
</main>

<footer>
  Salim Chart • أداة تحليل وليست توصية استثمارية
</footer>

<script>
const symbols = [
  { id:"AAPL", name:"Apple", base:190 },
  { id:"TSLA", name:"Tesla", base:250 },
  { id:"MSFT", name:"Microsoft", base:420 },
  { id:"NVDA", name:"NVIDIA", base:130 },
  { id:"BTCUSD", name:"Bitcoin", base:68000 },
  { id:"ETHUSD", name:"Ethereum", base:3500 }
];

let currentSymbol = symbols[0];
let candles = [];
let indicators = { sma:true, ema:false, rsi:false };
let chart, candleSeries, smaSeries, emaSeries, rsiSeries;

const select = document.getElementById("symbolSelect");
const watchlist = document.getElementById("watchlist");
const alertsBox = document.getElementById("alerts");

symbols.forEach(s => {
  const option = document.createElement("option");
  option.value = s.id;
  option.textContent = `${s.name} (${s.id})`;
  select.appendChild(option);
});

function seededRandom(seed) {
  let value = seed;
  return function() {
    value = (value * 9301 + 49297) % 233280;
    return value / 233280;
  };
}

function generateCandles(symbol) {
  const random = seededRandom(symbol.id.split("").reduce((a,c)=>a+c.charCodeAt(0),0));
  let price = symbol.base;
  const result = [];

  for (let i=0; i<180; i++) {
    const change = (random() - 0.5) * symbol.base * 0.03;
    const open = price;
    const close = price + change;
    const high = Math.max(open, close) + random() * symbol.base * 0.01;
    const low = Math.min(open, close) - random() * symbol.base * 0.01;
    const volume = 100000 + random() * 900000;

    result.push({
      time: Math.floor(Date.now() / 1000) - (180 - i) * 86400,
      open, high, low, close, volume
    });

    price = close;
  }

  return result;
}

function sma(data, period=20) {
  const result = [];
  for (let i=period-1; i<data.length; i++) {
    const slice = data.slice(i-period+1, i+1);
    result.push({ time:data[i].time, value:slice.reduce((s,c)=>s+c.close,0)/period });
  }
  return result;
}

function ema(data, period=20) {
  const k = 2/(period+1);
  let emaValue = data[0].close;
  const result = [];

  data.forEach((candle, index) => {
    emaValue = candle.close * k + emaValue * (1-k);
    if (index >= period-1) result.push({ time:candle.time, value:emaValue });
  });

  return result;
}

function rsi(data, period=14) {
  const result = [];
  let gains=0, losses=0;

  for (let i=1; i<data.length; i++) {
    const diff = data[i].close - data[i-1].close;
    const gain = Math.max(diff,0);
    const loss = Math.max(-diff,0);

    if (i <= period) {
      gains += gain;
      losses += loss;
    }

    if (i === period) {
      const avgGain = gains/period;
      const avgLoss = losses/period;
      const rs = avgLoss === 0 ? 100 : avgGain/avgLoss;
      result.push({ time:data[i].time, value:100 - (100/(1+rs)) });
    }

    if (i > period) {
      const prev = result[result.length-1].value;
      const avgGain = (gains*(period-1)+gain)/period;
      const avgLoss = (losses*(period-1)+loss)/period;
      const rs = avgLoss === 0 ? 100 : avgGain/avgLoss;
      const value = 100 - (100/(1+rs));
      result.push({ time:data[i].time, value });
      gains = avgGain*period;
      losses = avgLoss*period;
    }
  }

  return result;
}

function initChart() {
  chart = LightweightCharts.createChart(document.getElementById("chart"), {
    layout:{ background:{ color:"#0b0f17" }, textColor:"#94a3b8" },
    grid:{ vertLines:{ color:"#1f2937" }, horzLines:{ color:"#1f2937" } },
    rightPriceScale:{ borderColor:"#1f2937" },
    timeScale:{ borderColor:"#1f2937" }
  });

  candleSeries = chart.addCandlestickSeries({
    upColor:"#22c55e", downColor:"#ef4444",
    borderUpColor:"#22c55e", borderDownColor:"#ef4444",
    wickUpColor:"#22c55e", wickDownColor:"#ef4444"
  });

  smaSeries = chart.addLineSeries({ color:"#22d3ee", lineWidth:2 });
  emaSeries = chart.addLineSeries({ color:"#a78bfa", lineWidth:2 });
  rsiSeries = chart.addLineSeries({ color:"#f59e0b", lineWidth:2 });
}

function updateChart() {
  candleSeries.setData(candles);
  smaSeries.setData(indicators.sma ? sma(candles) : []);
  emaSeries.setData(indicators.ema ? ema(candles) : []);
  rsiSeries.setData(indicators.rsi ? rsi(candles) : []);
  chart.timeScale().fitContent();
}

function updateStats() {
  const last = candles[candles.length-1];
  const first = candles[0];
  const change = ((last.close - first.close)/first.close)*100;

  document.getElementById("chartTitle").textContent = `${currentSymbol.name} (${currentSymbol.id})`;
  document.getElementById("price").textContent = last.close.toFixed(2);
  document.getElementById("change").textContent = `${change.toFixed(2)}%`;
  document.getElementById("change").className = change >= 0 ? "up" : "down";
  document.getElementById("high").textContent = Math.max(...candles.map(c=>c.high)).toFixed(2);
  document.getElementById("low").textContent = Math.min(...candles.map(c=>c.low)).toFixed(2);
}

function loadSymbol() {
  currentSymbol = symbols.find(s => s.id === select.value);
  candles = generateCandles(currentSymbol);
  updateChart();
  updateStats();
  renderWatchlist();
  renderAlerts();
}

function getWatchlist() {
  return JSON.parse(localStorage.getItem("salim_watchlist") || "[]");
}

function saveWatchlist(list) {
  localStorage.setItem("salim_watchlist", JSON.stringify(list));
}

function renderWatchlist() {
  const list = getWatchlist();
  watchlist.innerHTML = "";

  if (!list.length) {
    watchlist.innerHTML = `<p class="small">لا توجد رموز في قائمة المراقبة.</p>`;
    return;
  }

  list.forEach(id => {
    const symbol = symbols.find(s => s.id === id);
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div>
        <b>${symbol.name}</b>
        <div class="small">${symbol.id}</div>
      </div>
      <button class="danger">إزالة</button>
    `;
    row.querySelector("button").onclick = () => {
      saveWatchlist(list.filter(x => x !== id));
      renderWatchlist();
    };
    watchlist.appendChild(row);
  });
}

function getAlerts() {
  return JSON.parse(localStorage.getItem("salim_alerts") || "[]");
}

function saveAlerts(list) {
  localStorage.setItem("salim_alerts", JSON.stringify(list));
}

function renderAlerts() {
  const list = getAlerts().filter(a => a.symbol === currentSymbol.id);
  alertsBox.innerHTML = "";

  if (!list.length) {
    alertsBox.innerHTML = `<p class="small">لا توجد تنبيهات لهذا الرمز.</p>`;
    return;
  }

  list.forEach(alert => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div>
        <b>${alert.price}</b>
        <div class="small">تنبيه سعري</div>
      </div>
      <button class="danger">حذف</button>
    `;
    row.querySelector("button").onclick = () => {
      saveAlerts(getAlerts().filter(x => x.id !== alert.id));
      renderAlerts();
    };
    alertsBox.appendChild(row);
  });
}

document.querySelectorAll("[data-ind]").forEach(button => {
  button.onclick = () => {
    const key = button.dataset.ind;
    indicators[key] = !indicators[key];
    button.classList.toggle("active", indicators[key]);
    updateChart();
  };
});

select.onchange = loadSymbol;

document.getElementById("refreshBtn").onclick = loadSymbol;

document.getElementById("addAlert").onclick = () => {
  const price = parseFloat(document.getElementById("alertPrice").value);
  if (!price || price <= 0) return alert("أدخل سعرًا صحيحًا");

  const list = getAlerts();
  list.push({ id:Date.now(), symbol:currentSymbol.id, price });
  saveAlerts(list);
  document.getElementById("alertPrice").value = "";
  renderAlerts();
};

initChart();
loadSymbol();
</script>

</body>
</html>
